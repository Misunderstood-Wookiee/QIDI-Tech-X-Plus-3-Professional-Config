# ============================
# Motion-Activated Lighting System
# ============================
[gcode_macro _MOTION_LIGHT_MONITOR]
description: Background loop to control chamber light based on motion
variable_timeout: 60
variable_last_motion: 0
gcode:
    {% set last_move = printer.toolhead.last_move_time %}
    {% set last_recorded = printer["gcode_macro _MOTION_LIGHT_MONITOR"].last_motion %}

    # Detect motion by comparing timestamps
    {% if last_move != last_recorded %}
        # Motion detected
        SET_GCODE_VARIABLE MACRO=_MOTION_LIGHT_MONITOR VARIABLE=last_motion VALUE={last_move}
        LIGHT_ON
    {% else %}
        # No motion — check timeout
        {% set elapsed = last_move - last_recorded %}
        {% if elapsed > timeout %}
            LIGHT_OFF
        {% endif %}
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_MOTION_LIGHT_LOOP DURATION=1

[delayed_gcode _MOTION_LIGHT_LOOP]
gcode:
    _MOTION_LIGHT_MONITOR # Continue monitoring motion

[delayed_gcode START_MOTION_LIGHT_MONITOR]
initial_duration: 2 # Start after 2 seconds
gcode:
    UPDATE_DELAYED_GCODE ID=_MOTION_LIGHT_LOOP DURATION=1 # Start the motion light monitor loop