name: Sync Docs to Wiki

permissions:
  contents: write

on:
  push:
    branches:
      - Beta
    paths:
      - 'docs/**'
  release:
    types: [published]

concurrency:
  group: sync-docs-to-wiki
  cancel-in-progress: true

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: github-docs-to-wiki
        uses: cmbrose/github-docs-to-wiki@v0.20
        # Consider pinning to a full commit SHA for supply-chain security
