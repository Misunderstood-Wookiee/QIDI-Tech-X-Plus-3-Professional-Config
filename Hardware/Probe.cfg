# BLTouch or Probe Configuration for QIDI X Plus 3D Printer
# If using a BLTouch, uncomment the [bltouch] section and comment out the [probe] section.
# Adjust the pin assignments and offsets as needed for your specific hardware setup. 
# Make sure to calibrate the Z offset after setting up the probe.

#[bltouch] # BLTouch Configuration (if used)
#sensor_pin:^MKS_THR:gpio21
#control_pin:MKS_THR:gpio11
#stow_on_each_sample: False

[probe] #  Probe Configuration (BLTouch or Similar)
pin: ^!MKS_THR:gpio21
x_offset: 27.8 # in mm, positive value means probe is to the right of the nozzle
y_offset: 6.75 # in mm, positive value means probe is in front of the nozzle
speed: 5 # in mm/s
samples: 3 # Number of samples to take
samples_result: average # Options: average, median, lowest, highest
sample_retract_dist: 3.0 # in mm
samples_tolerance: 0.01 # in mm
samples_tolerance_retries:3 # Number of retries if tolerance not met