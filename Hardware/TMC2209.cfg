# Configuration file for QIDI X Plus 3D Printer - TMC2209 Stepper Drivers
# This file contains TMC2209 stepper driver configurations for the X, Y, Z axes and the extruder.
# Adjust the parameters as needed for your specific hardware setup (ONLY IF YOU KNOW WHAT YOU ARE DOING).

[tmc2209 extruder]
uart_pin: MKS_THR:gpio6
interpolate: True
run_current: 1.1 # Amps
hold_current: 0.3
#sense_resistor: 0.110
stealthchop_threshold: 0 # Set to 0 to enable StealthChop for all speeds

[tmc2209 stepper_x]
uart_pin: PD2
run_current:1.1 # Amps
#hold_current: 0.5
interpolate: True
stealthchop_threshold: 0   # effectively disables StealthChop
diag_pin:^PB8
driver_SGTHRS: 85

[tmc2209 stepper_y]
uart_pin: PB9
run_current: 1.1 # Amps
#hold_current: 0.5
interpolate: True
stealthchop_threshold: 0   # effectively disables StealthChop
diag_pin:^PC0
driver_SGTHRS: 97

[tmc2209 stepper_z]
uart_pin: PC5
run_current: 0.45 # Amps
#hold_current: 0.2
interpolate: True
stealthchop_threshold: 1200 # Set to 0 to enable StealthChop for all speeds