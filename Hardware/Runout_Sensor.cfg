# Runout Sensor Configuration for QIDI X Plus 3D Printer
# This file sets up the filament runout sensor for the printer.
# Adjust the parameters as needed for your specific hardware setup (ONLY IF YOU KNOW WHAT YOU ARE DOING).
# Ensure the switch_pin matches your wiring configuration. # Normally, '!' indicates a normally closed switch.

[filament_switch_sensor fila]
pause_on_runout: True # Enable pausing on filament runout
runout_gcode: 
            PAUSE # G-code command to execute on filament runout
            M25  # Pause SD card print if applicable
            SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1 # Re-enable sensor after pausing
event_delay: 3.0 # Delay before executing runout actions
pause_delay: 0.5 # Delay before pausing the print
switch_pin: !PC1 # Pin connected to the filament runout sensor (normally closed switch)