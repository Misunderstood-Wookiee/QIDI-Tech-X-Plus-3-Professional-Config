# ============================
# Material Load/Unload Macros with Temperature Profiles
# ============================ 
# Shared Material Temperature Lookup Macro for unload/load operations
[gcode_macro _GET_MATERIAL_TEMPS]
description: Internal helper to map MATERIAL to load/unload temps
variable_default_load: 200
variable_default_unload: 200
gcode:
    {% set mat = params.MATERIAL|default("PLA")|upper %}

    {% if mat == "PLA" %}
        {% set load = 200 %}
        {% set unload = 185 %}
    {% elif mat == "PETG" %}
        {% set load = 230 %}
        {% set unload = 210 %}
    {% elif mat == "ABS" or mat == "ASA" %}
        {% set load = 245 %}
        {% set unload = 230 %}
    {% elif mat == "NYLON" %}
        {% set load = 260 %}
        {% set unload = 240 %}
    {% else %}
        {% set load = default_load %}
        {% set unload = default_unload %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=material_temps VARIABLE=load VALUE={load}
    SET_GCODE_VARIABLE MACRO=material_temps VARIABLE=unload VALUE={unload}

# Material Temperature Storage
[gcode_macro material_temps]
variable_load: 0
variable_unload: 0
gcode:
    # No-op to satisfy QIDI Klipper

# Macros to Load/Unload specific materials using FILAMENT_LOAD and FILAMENT_UNLOAD
[gcode_macro LOAD_PLA]
description: Load PLA using FILAMENT_LOAD with PLA material profile
gcode:
    FILAMENT_LOAD MATERIAL=PLA

[gcode_macro LOAD_PETG]
description: Load PETG using FILAMENT_LOAD with PETG material profile
gcode:
    FILAMENT_LOAD MATERIAL=PETG

[gcode_macro LOAD_ABS]
description: Load ABS using FILAMENT_LOAD with ABS material profile
gcode:
    FILAMENT_LOAD MATERIAL=ABS

[gcode_macro LOAD_ASA]
description: Load ASA using FILAMENT_LOAD with ASA material profile
gcode:
    FILAMENT_LOAD MATERIAL=ASA

[gcode_macro LOAD_NYLON]
description: Load Nylon using FILAMENT_LOAD with Nylon material profile
gcode:
    FILAMENT_LOAD MATERIAL=NYLON

[gcode_macro UNLOAD_PLA]
description: Unload PLA using FILAMENT_UNLOAD with PLA material profile
gcode:
    FILAMENT_UNLOAD MATERIAL=PLA

[gcode_macro UNLOAD_PETG]
description: Unload PETG using FILAMENT_UNLOAD with PETG material profile
gcode:
    FILAMENT_UNLOAD MATERIAL=PETG

[gcode_macro UNLOAD_ABS]
description: Unload ABS using FILAMENT_UNLOAD with ABS material profile
gcode:
    FILAMENT_UNLOAD MATERIAL=ABS

[gcode_macro UNLOAD_ASA]
description: Unload ASA using FILAMENT_UNLOAD with ASA material profile
gcode:
    FILAMENT_UNLOAD MATERIAL=ASA

[gcode_macro UNLOAD_NYLON]
description: Unload Nylon using FILAMENT_UNLOAD with Nylon material profile
gcode:
    FILAMENT_UNLOAD MATERIAL=NYLON
# -------------------------------

## ============================
# Chamber Light Control Macros
# ============================
[gcode_macro LIGHT_ON]
description: Turn chamber light on
gcode:
    SET_PIN PIN=caselight VALUE=1

[gcode_macro LIGHT_OFF]
description: Turn chamber light off
gcode:
    SET_PIN PIN=caselight VALUE=0

[gcode_macro LIGHT_TOGGLE]
description: Toggle chamber light
gcode:
    {% if printer["output_pin caselight"].value == 1 %}
        SET_PIN PIN=caselight VALUE=0
    {% else %}
        SET_PIN PIN=caselight VALUE=1
    {% endif %}

[gcode_macro LIGHT_BLINK]
description: Blink chamber light N times
variable_blinks: 1
variable_delay: 300   # milliseconds
gcode:
    {% for i in range(blinks|int) %}
        SET_PIN PIN=caselight VALUE=0
        G4 P{delay}
        SET_PIN PIN=caselight VALUE=1
        G4 P{delay}
    {% endfor %}
# -------------------------------

# ============================
# Buzzer / Sound Macros
# ============================
[gcode_macro BEEP]
description: Short confirmation beep
gcode:
    SET_PIN PIN=beeper VALUE=1
    G4 P100
    SET_PIN PIN=beeper VALUE=0

[gcode_macro BEEP_LONG]
description: Long alert beep
gcode:
    SET_PIN PIN=beeper VALUE=1
    G4 P300
    SET_PIN PIN=beeper VALUE=0

[gcode_macro BEEP_REPEAT]
description: Repeat beep N times
variable_count: 2
variable_delay: 150
gcode:
    {% for i in range(count|int) %}
        SET_PIN PIN=beeper VALUE=1
        G4 P100
        SET_PIN PIN=beeper VALUE=0
        G4 P{delay}
    {% endfor %}

