# Shared Material Temperature Lookup Macro for unload/load operations
[gcode_macro _GET_MATERIAL_TEMPS]
description: Internal helper to map MATERIAL to load/unload temps
variable_default_load: 200
variable_default_unload: 200
gcode:
    {% set mat = params.MATERIAL|default("PLA")|upper %}

    {% if mat == "PLA" %}
        {% set load = 200 %}
        {% set unload = 185 %}
    {% elif mat == "PETG" %}
        {% set load = 230 %}
        {% set unload = 210 %}
    {% elif mat == "ABS" or mat == "ASA" %}
        {% set load = 245 %}
        {% set unload = 230 %}
    {% elif mat == "NYLON" %}
        {% set load = 260 %}
        {% set unload = 240 %}
    {% else %}
        # Unknown material → use defaults
        {% set load = default_load %}
        {% set unload = default_unload %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_GET_MATERIAL_TEMPS VARIABLE=load VALUE={load}
    SET_GCODE_VARIABLE MACRO=_GET_MATERIAL_TEMPS VARIABLE=unload VALUE={unload}