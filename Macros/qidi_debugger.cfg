[gcode_macro FILAMENT_DEBUG]
description: Show material-aware load/unload temperatures
gcode:
    {% set mat = params.MATERIAL|default("PLA") %}
    _GET_MATERIAL_TEMPS MATERIAL={mat}

    {% set load = printer["gcode_macro material_temps"].load %}
    {% set unload = printer["gcode_macro material_temps"].unload %}

    M117 Material: {mat}
    {action_respond_info("Material: %s" % mat)}
    {action_respond_info("Load Temp: %s" % load)}
    {action_respond_info("Unload Temp: %s" % unload)}