# Main Macros for QIDI X-Plus 3D Printer - Modified for Klipper Firmware
# Author: Mr.Business/QIDI Modding Community
# Description: This file contains the main macros for printer operations including start, end, pause, resume, and calibration routines.
# Note: Ensure to back up your original configuration before applying changes.

#[gcode_macro G30] # Single Z-Probe and Calibrate Macro
#    G28
#    G1 X100 Y130 Z10
#    PROBE_CALIBRATE

[gcode_macro SHAPER_CALIBRATE] # Input Shaper Calibration Macro
rename_existing: RESHAPER_CALIBRATE
gcode:
    SAVE_GCODE_STATE NAME=SHAPER_STATE # Save current state
    
    {% if "xyz" not in printer.toolhead.homed_axes %} # check if axes are not homed
        G28 # Home All Axes (home if axes are not homed)
    {% endif %}
    
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} F6000 # Move to center for safety
    G0 Z10 F600 # Raise nozzle to safe height
    
    RESHAPER_CALIBRATE FREQ_START=30 FREQ_END=150 # Run input shaper calibration
    
    RESTORE_GCODE_STATE NAME=SHAPER_STATE # Restore previous state

[gcode_macro PRINT_START] # Print Start Macro
gcode:
    G28                                ; Home all axes (X, Y, Z)
    M141 S0                            ; Set chamber temperature to 0 (off)
    G0 Z50 F600                        ; Raise nozzle to Z=50 mm at 600 mm/min for clearance
    M190 S[hot_plate_temp_initial_layer] ; Heat bed to initial layer temp and wait
    G28 Z                                ; Home Z axis again (after bed heating)
    G29                                  ; Mesh bed leveling (comment out to disable)
    G0 X0 Y0 Z50 F6000                   ; Move to origin with Z=50 mm at fast speed
    M141 S{overall_chamber_temperature}  ; Set chamber temperature to target value
    M109 S[nozzle_temperature_initial_layer] ; Heat nozzle to initial layer temp and wait
    M106 P3 S255                             ; Turn on fan #3 at full speed
    M83                                      ; Set extruder to relative mode
    LINE_PURGE                               ; Purge line macro (define separately)
    

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% if (printer.gcode_move.position.z) < 200 %}       ; check that zhop doesn't exceed z max

        G1 Z200 F600                                       

    {% endif %}

    G1  X0 Y0 F12000


    SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT

[gcode_macro PRINT_END] # Print End Macro
gcode:
    M106 P2 S0  # Close Hotend Fan
    M106 P0 S0  # Close Part Cooling Fan
    M106 P3 S0  # Close Activated Carbon Fan
    
    M104 S0 # turn off hotend heater
    M140 S0 # turn off bed heater
    M141 S0 # turn off chamber heater

    M220 S100 # reset speed factor to 100%
    M221 S100 # reset flow rate to 100%

    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} # Set timeout back to configured value
    CLEAR_PAUSE                                         # Clear pause state if any
    BED_MESH_CLEAR                                      # Restore Leveling Data
    BED_MESH_PROFILE LOAD=default                       # Load default bed mesh profile
    G31                                                 # Reset G29 variable
    SET_FILAMENT_SENSOR SENSOR=fila ENABLE=0            # disable filament sensor
    G1 E-3 F1800                                        # retract 3 mm to prevent oozing
    G0 Z{min(max_print_height, max_layer_z + 20)} F600  # Lift nozzle safely above the print
    G0 X0 Y0 F12000                                     # Park head at front-left corner
    M84 # disable motors

    BEEP I=2 DUR=500 # Beep twice to indicate print end

[gcode_macro PAUSE] # Pause Macro
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(50)|int %}                                                   ; z hop amount
    
    {% if printer['pause_resume'].is_paused|int == 0 %}     
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro
                                
#       SET_FILAMENT_SENSOR SENSOR=fila ENABLE=0                                             ; disable filament sensor       
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume                
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
#            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0 # set zhop to 0 for resume
        {% endif %}
        SAVE_GCODE_STATE NAME=PAUSEPARK2
        G90                                                                                  ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y} F6000   ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error) 
        M104 S0                                                                              ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=86400                                                      ; set timeout to 24 hours

        SET_STEPPER_ENABLE STEPPER=extruder enable=0
    {% endif %} # end if not paused


[gcode_macro RESUME] # Resume Macro
rename_existing: BASE_RESUME
variable_zhop: 0 # store zhop amount
variable_etemp: 0 # store hotend temp before pause
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                          ; hotend prime amount (in mm)
    
    {% if printer['pause_resume'].is_paused|int == 1 %}
    SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1                                           ; enable filament sensor
        #INITIAL_RGB                                                                    ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)  
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}                                                
            G1  E{e} F900                                                ; prime nozzle by E, lower Z back down
#        {% else %}                      
#            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}  
        RESTORE_GCODE_STATE NAME=PAUSEPARK2 MOVE=1 MOVE_SPEED=100                            
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
        BASE_RESUME                                                                  ; resume print
    {% endif %} # end if paused

[gcode_macro BEEP] # Beep Macro
gcode:
    # Parameters
    {% set i = params.I|default(1)|int %}        ; Iterations (number of times to beep).
    {% set dur = params.DUR|default(100)|int %}  ; Duration/wait of each beep in ms. Default 100ms.

    {% if printer["output_pin sound"].value|int == 1 %}
        {% for iteration in range(i|int) %}
            SET_PIN PIN=beeper VALUE=1
            G4 P{dur}
            SET_PIN PIN=beeper VALUE=0
    		G4 P{dur}
        {% endfor %}
    {% endif %} # end if beeper is enabled

