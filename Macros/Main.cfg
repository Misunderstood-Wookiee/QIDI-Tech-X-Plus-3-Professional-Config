# Main Macros for QIDI X-Plus 3D Printer - Modified for Klipper Firmware
# Author: Mr.Business/QIDI Modding Community
# Description: This file contains the main macros for printer operations including start, end, pause, resume, and calibration routines.
# Note: Ensure to back up your original configuration before applying changes.

[gcode_macro PRINT_START]
gcode:
    SAVE_GCODE_STATE NAME=PS_STATE
    # -------------------------------
    # Parameters from slicer + defaults
    # -------------------------------
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
    {% set LAYER = params.LAYER|default(0.2)|float %}
    {% set Z_ADJUST = params.Z_ADJUST|default(0.0)|float %}  # optional from slicer
    # -------------------------------
    # 0. Clear any previous Z offset
    # -------------------------------
    SET_GCODE_OFFSET Z=0 MOVE=0
    # -------------------------------
    # 1. Home and prepare machine
    # -------------------------------
    M117 Homing...
    G28 # Home all axes
    M141 S0
    G90
    G0 Z50 F600
    # -------------------------------
    # 2. Material-aware chamber logic
    #    - Treat "high bed temp" as ABS/ASA-style
    # -------------------------------
    {% if BED_TEMP >= 90 %}
        # ABS/ASA-style: use requested chamber temp
        {% set chamber_target = CHAMBER_TEMP if CHAMBER_TEMP > 0 else 45 %}
    {% else %}
        # PLA/PETG-style: usually no chamber heat
        {% set chamber_target = CHAMBER_TEMP if CHAMBER_TEMP > 0 else 0 %}
    {% endif %}
    M117 Heating chamber...
    M141 S{chamber_target}
    # -------------------------------
    # 3. Heat bed while chamber warms
    # -------------------------------
    M117 Heating bed...
    M190 S{BED_TEMP}
    # Re-home Z after thermal expansion
    M117 Re-homing Z...
    G28 Z
    # -------------------------------
    # 4. Adaptive Mesh
    # -------------------------------
    M117 Adaptive Mesh...
    G29
    SMART_PARK
    # -------------------------------
    # 5. Heat nozzle LAST
    # -------------------------------
    M117 Heating nozzle...
    M109 S{EXTRUDER_TEMP}
    # -------------------------------
    # 6. Optional Z-offset compensation hook
    #    (slicer can pass Z_ADJUST, default 0.0)
    # -------------------------------
    {% if Z_ADJUST != 0.0 %}
        M117 Z offset adj: {Z_ADJUST}
        SET_GCODE_OFFSET Z={Z_ADJUST} MOVE=0
    {% endif %}
    # -------------------------------
    # 7. Fans, Extruder Mode, Adaptive Purge
    # -------------------------------
    M106 P3 S255 # Set cooling fan to full speed
    M83 # Set extruder to relative mode
    # Adaptive purge length based on first layer height
    {% set base_purge_len = 40.0 %}
    {% set purge_len = base_purge_len * (LAYER / 0.2) %}
    {% if purge_len < 20.0 %}
        {% set purge_len = 20.0 %}
    {% endif %}
    {% if purge_len > 80.0 %}
        {% set purge_len = 80.0 %}
    {% endif %}
    M117 Purging...
    SETUP_LINE_PURGE LINE_LENGTH={purge_len}
    LINE_PURGE
    RESTORE_GCODE_STATE NAME=PS_STATE
    
[gcode_macro PRINT_END]
gcode:
    # 1. Stop extrusion and lift
    G91
    G1 E-3 F1800
    G1 Z10 F600
    G90
    # 2. Park safely
    SMART_PARK # call smart park macro from Adaptive_Mesh.cfg
    # 3. Turn off heaters and fans
    M104 S0
    M140 S0
    M141 S0
    M106 P0 S0
    M106 P2 S0
    M106 P3 S0
    # 4. Reset speed/flow and idle timeout
    M220 S100
    M221 S100
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    # 5. Clear mesh and pause state
    BED_MESH_CLEAR
    CLEAR_PAUSE
    # 6. Disable motors and beep
    M84
    BEEP I=2 DUR=500 # beep twice for 500ms

[gcode_macro PAUSE]
rename_existing: _BASE_PAUSE
gcode:
    {% set z = params.Z|default(50)|int %}
    {% if printer['pause_resume'].is_paused|int == 0 %}
        # Store zhop + temp for RESUME
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}
        # Save current print position
        SAVE_GCODE_STATE NAME=PAUSE
        # Z-hop
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
            G91
            G1 Z{z} F900
        {% else %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90
        # Park safely
        SMART_PARK
        SAVE_GCODE_STATE NAME=PAUSEPARK
        # Cool hotend
        M104 S0
        # Long idle timeout
        SET_IDLE_TIMEOUT TIMEOUT=86400
        # Disable extruder motor
        SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
        # Call base pause LAST to avoid auto-resume
        _BASE_PAUSE
    {% endif %}

[gcode_macro RESUME]
rename_existing: _BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set prime = params.E|default(2.5)|float %}
    {% if printer['pause_resume'].is_paused|int == 1 %}
        M117 Resuming...
        # Re-enable filament sensor
        SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1
        # Restore idle timeout
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        # Reheat nozzle if needed
        {% if etemp > 0 %}
            M109 S{etemp|int}
        {% endif %}
        # Return from park
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100
        # Prime nozzle
        G91
        M83
        G1 E{prime} F900
        G90
        # Restore original print position
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60
        _BASE_RESUME
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: _BASE_CANCEL_PRINT
gcode:
    M117 Cancelling...
    # Safe Z lift
    {% set current_z = printer.gcode_move.position.z %}
    {% set max_z = printer.toolhead.axis_maximum.z %}
    {% set target_z = current_z + 10 %}
    {% if target_z > max_z %}
        {% set target_z = max_z %}
    {% endif %}
    G91
    G1 Z10 F600
    G90
    # Park safely
    SMART_PARK
    # Shut down heaters and fans
    M104 S0
    M140 S0
    M141 S0
    M106 P0 S0
    M106 P2 S0
    M106 P3 S0
    # Clear mesh and pause state
    BED_MESH_CLEAR
    CLEAR_PAUSE
    # Reset SD file
    SDCARD_RESET_FILE
    _BASE_CANCEL_PRINT
    M117 Print cancelled

[gcode_macro BEEP] # Beep Macro
gcode:
    # Parameters
    {% set i = params.I|default(1)|int %}        ; Iterations (number of times to beep).
    {% set dur = params.DUR|default(100)|int %}  ; Duration/wait of each beep in ms. Default 100ms.

    {% if printer["output_pin sound"].value|int == 1 %}
        {% for iteration in range(i|int) %}
            SET_PIN PIN=beeper VALUE=1
            G4 P{dur}
            SET_PIN PIN=beeper VALUE=0
    		G4 P{dur}
        {% endfor %}
    {% endif %} # end if beeper is enabled

[gcode_macro G30] # Single Z-Probe and Calibrate Macro
gcode:
    BED_MESH_CLEAR      # Clear Leveling Data
#    G28 
    BED_MESH_CALIBRATE mesh_min=10,10  mesh_max=265,265  METHOD=manual # Manual Leveling

[gcode_macro M141]
gcode:
    {% set s = params.S|float %}
    SET_HEATER_TEMPERATURE HEATER=hot TARGET={([s, 65]|min)}

[gcode_macro M191] # Wait for Chamber Temperature
gcode:
  {% if printer["heater_generic hot"] is defined %} # Check if chamber heater is defined
    {% set s = params.S|float %} # Chamber temperature
    M141 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %} # If target temp is not 0
      M140 S{([s, 65]|min)-2}  ; Set chamber temp with safety margin
      TEMPERATURE_WAIT SENSOR="heater_generic hot" MINIMUM={([s, 65]|min)-2} # Wait for chamber temp (within 2 degrees) 
    {% endif %}
  {% endif %}
 
[gcode_macro M106] # Set Fan Speed Macro
gcode:
    {% if params.P is defined %}
      {% if params.S is defined %}
        SET_PIN PIN=fan{params.P|int} VALUE={params.S|int}
      {% else %}
        SET_PIN PIN=fan{params.P|int} VALUE=255
      {% endif %}
    {% endif %} 

    {% if params.T is defined %}
        {% if (params.T|int)==-2 %}
          {% if params.S is defined %}       
            SET_PIN PIN=fan3 VALUE={params.S|int}
          {% else %}
            SET_PIN PIN=fan3 VALUE=255
          {% endif %}
        {% endif %}
    {% endif %}

    {% if params.P is undefined %}
    {% if params.T is undefined %}
    {% if params.S is defined %}
            SET_PIN PIN=fan0 VALUE={params.S|int}
       {% else %}
            SET_PIN PIN=fan0 VALUE=255       
    {% endif %}
    {% endif %}
    {% endif %}

[gcode_macro M107] # Turn Off Fans Macro
gcode:  
    SET_PIN PIN=fan0 VALUE=0 
#    SET_PIN PIN=fan1 VALUE=0
#    SET_PIN PIN=fan2 VALUE=0 

[gcode_macro M303]
gcode:
    {% if params.E is defined %}
     {% if params.S is defined %}
        {% if (params.E|int)==-1 %} 
         PID_CALIBRATE HEATER=hot_plate_temp_initial_layer TARGET={params.S|int}
        {% endif %}
        {% if (params.E|int)==0 %}
         PID_CALIBRATE HEATER=extruder TARGET={params.S|int}
        {% endif %}
     {% endif %}
  {% endif %}

[gcode_macro M8029] # Filament Sensor Enable/Disable Macro
gcode:
     {% if params.D is defined %}
       {% if (params.D|int)==1 %} 
        SET_FILAMENT_SENSOR SENSOR=fila  ENABLE=1 # enable filament sensor
       {% endif %}
       {% if (params.D|int)==0 %} 
        SET_FILAMENT_SENSOR SENSOR=fila  ENABLE=0 # disable filament sensor
       {% endif %}
     {% endif %}

[gcode_macro M900] # Set Pressure Advance Macro
gcode:
    {% if params.K is defined %} 
          SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}  
    {% if params.T is defined %}    
       SET_PRESSURE_ADVANCE SMOOTH_TIME={params.T}
    {% endif %}

[gcode_macro M290] # Set Z-Offset Macro
gcode:
   SET_GCODE_OFFSET Z_ADJUST={params.Z}

[gcode_macro M901] # Shaper Calibrate and Save Config Macro
gcode:
    G28 # Home All Axes
    SHAPER_CALIBRATE # Input Shaper Calibration
    SAVE_CONFIG # Save Config to retain shaper values
 
[gcode_macro M81] # Power Off Macro
description: PowerOff
gcode: 
  M84 # disable motors
  SET_PIN PIN=pwc VALUE=0 # Power Off PSU

[gcode_macro M0] # Stop/Pause Macro
gcode:
    PAUSE # Pause Print

[gcode_macro M25] # SD Card Pause Macro
rename_existing: M9925
gcode:
    PAUSE # Pause Print

[gcode_macro beep_on] # Turn On Beep Macro
gcode:
    SET_PIN PIN=sound VALUE=1

[gcode_macro beep_off] # Turn Off Beep Macro
gcode:
    SET_PIN PIN=sound VALUE=0


[gcode_arcs] # Enable G2/G3 Arc Support
resolution: 1.0 # mm

[gcode_macro M109] # Set Hotend Temperature and Wait Macro
rename_existing: M99109 # Rename existing M109 to M99109
gcode:
    #Parameters
    {% set s = params.S|float %}

    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}
      
[gcode_macro M4029] # Probe Calibrate Macro
gcode:
    BED_MESH_CLEAR # Clear Leveling Dat
    G91  # Relative Positioning
    G1 Z10 F600
    G90 # Absolute Positioning
    G28 # Home All Axes
    G1 X{printer.toolhead.axis_maximum.x/2 - printer.probe["x_offset"]} Y{printer.toolhead.axis_maximum.y/2 - printer.probe["y_offset"]} F7800
    G1 Z15 F600
    ABORT
    PROBE_CALIBRATE # Calibrate Probe
    ABORT
    G0 Z0 # Move to Z0 after calibration

[gcode_macro M603] # Filament Unload
description: Unload filament safely in stages
gcode:
    {% set unload_len = params.LEN|default(80)|float %}
    {% set fast_len = unload_len * 0.7 %}
    {% set slow_len = unload_len - fast_len %}
    M117 Unloading filament...
    M83
    # Slow initial pull to avoid grinding
    G1 E-{slow_len} F600
    # Fast retract out of path
    G1 E-{fast_len} F2400
    M117 Unload complete


[gcode_macro M604] # Filament Load
description: Load filament safely in stages
gcode:
    {% set load_len = params.LEN|default(80)|float %}
    {% set fast_len = load_len * 0.7 %}
    {% set slow_len = load_len - fast_len %}
    M117 Loading filament...
    M83
    # Fast push to near hotend
    G1 E{fast_len} F2400
    # Slow push into melt zone
    G1 E{slow_len} F600
    M117 Load complete


[gcode_macro G31] # Set G29 Variable Macro
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=1

[gcode_macro G32] # Clear G29 Variable Macro
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=0


[gcode_macro G29] # Auto Bed Leveling Macro
variable_k:1
gcode:

    {% if k|int==1 %}
        BED_MESH_CLEAR      # Clear Leveling Data
#    G28   
        BED_MESH_CALIBRATE PROFILE=kamp  # Auto Leveling
    {% endif %}

[gcode_macro M204] # Set Acceleration Macro
rename_existing: M99204 # Rename existing M204 to M99204
gcode:
    {% if params.S is defined %}
        {% set s = params.S|float %}
    {% endif %}
    {% if params.P is defined %}
    {% if params.T is defined %}
        {% set s = [params.P|float ,params.T|float] | min %}
    {% endif %}
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL={s}
    SET_VELOCITY_LIMIT ACCEL_TO_DECEL={s/2}

[gcode_macro SHAPER_CALIBRATE]
rename_existing: RESHAPER_CALIBRATE
gcode:
    SAVE_GCODE_STATE NAME=SHAPER_STATE

    # Prevent running during a print
    {% if printer.print_stats.state == "printing" %}
        M117 Cannot run shaper calibration
        CANCEL_PRINT
    {% endif %}

    M117 Shaper calibration in 5s...
    G4 P5000 # wait 5 seconds

    # Ensure axes are homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Homing...
        G28
    {% endif %}

    G90 # Absolute positioning
    G0 Z20 F600 # Lift Z for safety

    # Move to center of bed
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} F6000

    # Disable part cooling fan (this can interfere with shaper calibration)
    M106 S0

    # Ensure hotend is cool
    {% if printer.extruder.temperature > 60 %}
        M117 Cooling hotend...
        M104 S0
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM=0 MAXIMUM=60 # Wait for hotend to cool
    {% endif %}

    # Run calibration
    M117 Running shaper test...
    RESHAPER_CALIBRATE FREQ_START=30 FREQ_END=150 # Frequency sweep from 30Hz to 150Hz
    M117 Shaper test complete
    RESTORE_GCODE_STATE NAME=SHAPER_STATE