# Main Macros for QIDI X-Plus 3D Printer - Modified for Klipper Firmware
# Author: Mr.Business/QIDI Modding Community
# Description: This file contains the main macros for printer operations including start, end, pause, resume, and calibration routines.
# Note: Ensure to back up your original configuration before applying changes.

#[gcode_macro G30] # Single Z-Probe and Calibrate Macro
#    G28
#    G1 X100 Y130 Z10
#    PROBE_CALIBRATE

[gcode_macro SHAPER_CALIBRATE]
rename_existing: RESHAPER_CALIBRATE
gcode:
    SAVE_GCODE_STATE NAME=SHAPER_STATE

    # Prevent running during a print
    {% if printer.print_stats.state == "printing" %}
        RESPOND TYPE=error MSG="Cannot run shaper calibration during a print"
        CANCEL_PRINT
    {% endif %}

    # Ensure accelerometer is detected
    {% if not printer["input_shaper"].accel_chip %}
        RESPOND TYPE=error MSG="No accelerometer detected - aborting"
        CANCEL_PRINT
    {% endif %}

    RESPOND TYPE=command MSG="Running Input Shaper Calibration in 5 seconds..."
    G4 P5000
    # Ensure axes are homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Homing before shaper calibration
        G28
    {% endif %}
    G90
    G0 Z20 F600

    # Move to center of bed
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} F6000
    # Disable part cooling fan
    M106 S0
    # Ensure hotend is cool
    {% if printer.extruder.temperature > 60 %}
        M117 Cooling hotend for shaper test
        M104 S0
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM=0 MAXIMUM=60
    {% endif %}

    # Run calibration
    RESHAPER_CALIBRATE FREQ_START=30 FREQ_END=150
    RESTORE_GCODE_STATE NAME=SHAPER_STATE

[gcode_macro PRINT_START]
gcode:
    SAVE_GCODE_STATE NAME=PS_STATE # Save current state
    # Parameter Defaults (Fall back to these if not provided by slicer)
    {% set BED_TEMP = params.BED_TEMP|default(70)|float %} # Bed Temperature
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(20)|float %} # Chamber Temperature        
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %} # Extruder Temperature
    # -------------------------------
    # 1. Home and prepare machine
    # -------------------------------
    M117 Homing...
    G28
    # Disable chamber heater initially
    M141 S0
    # Lift Z high for safety (Qidi Z drift protection)
    G90
    G0 Z50 F600
    # -------------------------------
    # 2. Heat bed first (best practice)
    # -------------------------------
    M117 Heating bed...
    M190 S{BED_TEMP}
    # Re-home Z after bed expansion
    G28 Z
    # -------------------------------
    # 3. Adaptive Mesh (Klipper firmware method)
    # -------------------------------
    M117 Adaptive Mesh...
    G29
    # Move to a safe position
    G0 X0 Y0 Z50 F6000
     # -------------------------------
    # 3. Adaptive Park (Smart Park Kampless method can be found in Functionality/Adaptive_Mesh.cfg)
    # -------------------------------
    SMART_PARK
    # -------------------------------
    # 4. Chamber + Nozzle Heating
    # -------------------------------
    M141 S{CHAMBER_TEMP}
    M117 Heating nozzle...
    M190 S{EXTRUDER_TEMP}
    # -------------------------------
    # 5. Fans, Extruder Mode, Purge
    # -------------------------------
    M106 P3 S255          ; Qidi internal fan
    M83                   ; Relative extrusion
    M117 Purging...
    LINE_PURGE # Adaptive Line Purge Macro can be found in Functionality/Adaptive_Mesh.cfg
    RESTORE_GCODE_STATE NAME=PS_STATE # Restore state
    
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% if (printer.gcode_move.position.z) < 200 %}  # check that zhop doesn't exceed z max
        G1 Z200 F600                                       
    {% endif %}
    G1  X0 Y0 F12000
    SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT

[gcode_macro PRINT_END]
description: Qidi-safe print end macro
gcode:
    # -------------------------------
    # 1. Turn off heaters and fans
    # -------------------------------
    M106 P2 S0          ; Hotend fan off
    M106 P0 S0          ; Part cooling fan off
    M106 P3 S0          ; Carbon filter fan off
    M104 S0             ; Hotend heater off
    M140 S0             ; Bed heater off
    M141 S0             ; Chamber heater off
    # -------------------------------
    # 2. Reset speed, flow, timeout
    # -------------------------------
    M220 S100
    M221 S100
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    # -------------------------------
    # 3. Cleanup state
    # -------------------------------
    CLEAR_PAUSE
    BED_MESH_CLEAR
    BED_MESH_PROFILE LOAD=default
    G31
    SET_FILAMENT_SENSOR SENSOR=fila ENABLE=0
    # -------------------------------
    # 4. Retract filament slightly
    # -------------------------------
    G91
    G1 E-3 F1800
    G90
    # -------------------------------
    # 5. Safe Z lift using Klipper state
    # -------------------------------
    {% set current_z = printer.toolhead.position.z %}
    {% set max_z = printer.toolhead.axis_maximum.z %}
    {% set target_z = current_z + 20 %}
    {% if target_z > max_z %}
        {% set target_z = max_z %}
    {% endif %}
    G0 Z{target_z} F600
    # -------------------------------
    # 6. Park at front-left
    # -------------------------------
    G0 X0 Y0 F12000
    # -------------------------------
    # 7. Disable motors and beep
    # -------------------------------
    M84
    BEEP I=2 DUR=500

[gcode_macro PAUSE] # Pause Macro
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(50)|int %}                                                   ; z hop amount
    
    {% if printer['pause_resume'].is_paused|int == 0 %}     
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro
                                
#       SET_FILAMENT_SENSOR SENSOR=fila ENABLE=0                                             ; disable filament sensor       
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume                
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
#            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0 # set zhop to 0 for resume
        {% endif %}
        SAVE_GCODE_STATE NAME=PAUSEPARK2
        G90                                                                                  ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y} F6000   ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error) 
        M104 S0                                                                              ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=86400                                                      ; set timeout to 24 hours

        SET_STEPPER_ENABLE STEPPER=extruder enable=0
    {% endif %} # end if not paused

[gcode_macro RESUME] # Resume Macro
rename_existing: BASE_RESUME
variable_zhop: 0 # store zhop amount
variable_etemp: 0 # store hotend temp before pause
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                          ; hotend prime amount (in mm)
    
    {% if printer['pause_resume'].is_paused|int == 1 %}
    SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1                                           ; enable filament sensor
        #INITIAL_RGB                                                                    ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)  
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}                                                
            G1  E{e} F900                                                ; prime nozzle by E, lower Z back down
#        {% else %}                      
#            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}  
        RESTORE_GCODE_STATE NAME=PAUSEPARK2 MOVE=1 MOVE_SPEED=100                            
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
        BASE_RESUME                                                                  ; resume print
    {% endif %} # end if paused

[gcode_macro BEEP] # Beep Macro
gcode:
    # Parameters
    {% set i = params.I|default(1)|int %}        ; Iterations (number of times to beep).
    {% set dur = params.DUR|default(100)|int %}  ; Duration/wait of each beep in ms. Default 100ms.

    {% if printer["output_pin sound"].value|int == 1 %}
        {% for iteration in range(i|int) %}
            SET_PIN PIN=beeper VALUE=1
            G4 P{dur}
            SET_PIN PIN=beeper VALUE=0
    		G4 P{dur}
        {% endfor %}
    {% endif %} # end if beeper is enabled

[gcode_macro G30] # Single Z-Probe and Calibrate Macro
gcode:
    BED_MESH_CLEAR      # Clear Leveling Data
#    G28 
    BED_MESH_CALIBRATE mesh_min=10,10  mesh_max=265,265  METHOD=manual # Manual Leveling

[gcode_macro M141] # Set Chamber Temperature
gcode:
    {% set s = params.S|float %}
    SET_HEATER_TEMPERATURE HEATER=hot TARGET={([s, 65]|min)}

[gcode_macro M191] # Wait for Chamber Temperature
gcode:
  {% if printer["heater_generic hot"] is defined %} # Check if chamber heater is defined
    {% set s = params.S|float %} # Chamber temperature
    M141 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %} # If target temp is not 0
      M140 S{([s, 65]|min)-2}  ; Set chamber temp with safety margin
      TEMPERATURE_WAIT SENSOR="heater_generic hot" MINIMUM={([s, 65]|min)-2} # Wait for chamber temp (within 2 degrees) 
    {% endif %}
  {% endif %}
 
[gcode_macro M106] # Set Fan Speed Macro
gcode:
    {% if params.P is defined %}
      {% if params.S is defined %}
        SET_PIN PIN=fan{params.P|int} VALUE={params.S|int}
      {% else %}
        SET_PIN PIN=fan{params.P|int} VALUE=255
      {% endif %}
    {% endif %} 

    {% if params.T is defined %}
        {% if (params.T|int)==-2 %}
          {% if params.S is defined %}       
            SET_PIN PIN=fan3 VALUE={params.S|int}
          {% else %}
            SET_PIN PIN=fan3 VALUE=255
          {% endif %}
        {% endif %}
    {% endif %}

    {% if params.P is undefined %}
    {% if params.T is undefined %}
    {% if params.S is defined %}
            SET_PIN PIN=fan0 VALUE={params.S|int}
       {% else %}
            SET_PIN PIN=fan0 VALUE=255       
    {% endif %}
    {% endif %}
    {% endif %}

[gcode_macro M107] # Turn Off Fans Macro
gcode:  
    SET_PIN PIN=fan0 VALUE=0 
#    SET_PIN PIN=fan1 VALUE=0
#    SET_PIN PIN=fan2 VALUE=0 

[gcode_macro M303] # PID Calibrate Macro
gcode:
    {% if params.E is defined %}
     {% if params.S is defined %}
        {% if (params.E|int)==-1 %} 
         PID_CALIBRATE HEATER=heater_bed TARGET={params.S|int}
        {% endif %}
        {% if (params.E|int)==0 %}
         PID_CALIBRATE HEATER=extruder TARGET={params.S|int}
        {% endif %}
     {% endif %}
  {% endif %}

[gcode_macro M8029] # Filament Sensor Enable/Disable Macro
gcode:
     {% if params.D is defined %}
       {% if (params.D|int)==1 %} 
        SET_FILAMENT_SENSOR SENSOR=fila  ENABLE=1 # enable filament sensor
       {% endif %}
       {% if (params.D|int)==0 %} 
        SET_FILAMENT_SENSOR SENSOR=fila  ENABLE=0 # disable filament sensor
       {% endif %}
     {% endif %}

[gcode_macro M900] # Set Pressure Advance Macro
gcode:
    {% if params.K is defined %} 
          SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}  
    {% if params.T is defined %}    
       SET_PRESSURE_ADVANCE SMOOTH_TIME={params.T}
    {% endif %}

[gcode_macro M290] # Set Z-Offset Macro
gcode:
   SET_GCODE_OFFSET Z_ADJUST={params.Z}

[gcode_macro M901] # Shaper Calibrate and Save Config Macro
gcode:
    G28 # Home All Axes
    SHAPER_CALIBRATE # Input Shaper Calibration
    SAVE_CONFIG # Save Config to retain shaper values
 
[gcode_macro M81] # Power Off Macro
description: PowerOff
gcode: 
  M84 # disable motors
  SET_PIN PIN=pwc VALUE=0 # Power Off PSU

[gcode_macro M0] # Stop/Pause Macro
gcode:
    PAUSE # Pause Print

[gcode_macro M25] # SD Card Pause Macro
rename_existing: M9925
gcode:
    PAUSE # Pause Print

[gcode_macro beep_on] # Turn On Beep Macro
gcode:
    SET_PIN PIN=sound VALUE=1

[gcode_macro beep_off] # Turn Off Beep Macro
gcode:
    SET_PIN PIN=sound VALUE=0


[gcode_arcs] # Enable G2/G3 Arc Support
resolution: 1.0 # mm

[gcode_macro M109] # Set Hotend Temperature and Wait Macro
rename_existing: M99109 # Rename existing M109 to M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}
      
[gcode_macro M4029] # Probe Calibrate Macro
gcode:
    BED_MESH_CLEAR # Clear Leveling Dat
    G91  # Relative Positioning
    G1 Z10 F600
    G90 # Absolute Positioning
    G28 # Home All Axes
    G1 X{printer.toolhead.axis_maximum.x/2 - printer.probe["x_offset"]} Y{printer.toolhead.axis_maximum.y/2 - printer.probe["y_offset"]} F7800
    G1 Z15 F600
    ABORT
    PROBE_CALIBRATE # Calibrate Probe
    ABORT
    G0 Z0 # Move to Z0 after calibration

[gcode_macro M603] # Filament Unload
description: filament unload
gcode:
    G92 E0
    G0  E15 F400
    G4  P1000
    G92 E0
    G1  E-80 F800

[gcode_macro M604] # Filament Load
description: filament load
gcode:
    M83
    G1  E80 F400

[gcode_macro G31] # Set G29 Variable Macro
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=1

[gcode_macro G32] # Clear G29 Variable Macro
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=0


[gcode_macro G29] # Auto Bed Leveling Macro
variable_k:1
gcode:

    {% if k|int==1 %}
        BED_MESH_CLEAR      # Clear Leveling Data
#    G28   
        BED_MESH_CALIBRATE PROFILE=kamp  # Auto Leveling
    {% endif %}

[gcode_macro M204] # Set Acceleration Macro
rename_existing: M99204 # Rename existing M204 to M99204
gcode:
    {% if params.S is defined %}
        {% set s = params.S|float %}
    {% endif %}
    {% if params.P is defined %}
    {% if params.T is defined %}
        {% set s = [params.P|float ,params.T|float] | min %}
    {% endif %}
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL={s}
    SET_VELOCITY_LIMIT ACCEL_TO_DECEL={s/2}