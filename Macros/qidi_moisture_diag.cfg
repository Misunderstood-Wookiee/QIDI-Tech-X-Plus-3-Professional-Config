# ============================================================
# MOISTURE_DIAGNOSTIC
# Uses  _GET_MATERIAL_TEMPS macro for adaptive temps
# Parks nozzle before/after, logs results, supports multi-speed
# ============================================================

[gcode_macro MOISTURE_DIAGNOSTIC]
description: "Moisture test using material temps, with park + logging + multi-speed diagnostics"

# User‑tunable defaults
variable_extrude_length: 15.0
variable_slow_feedrate: 120.0
variable_medium_feedrate: 300.0
variable_fast_feedrate: 600.0
variable_retract: 2.0

# Park position (safe, out of the way)
variable_park_x: 10.0
variable_park_y: 10.0
variable_park_z: 20.0

# Log file
variable_logfile: "/tmp/moisture_check.log"

gcode:
    {% set material = params.MATERIAL|default("PLA")|upper %}
    {% set multi = params.MULTI|default(0)|int %}

    # -----------------------------------------
    # 1. PARK BEFORE TEST
    # -----------------------------------------
    G90
    G1 Z{printer["gcode_macro MOISTURE_DIAGNOSTIC"].park_z} F1200
    G1 X{printer["gcode_macro MOISTURE_DIAGNOSTIC"].park_x} \
       Y{printer["gcode_macro MOISTURE_DIAGNOSTIC"].park_y} F6000

    # -----------------------------------------
    # 2. GET MATERIAL TEMPS (your existing macro)
    # -----------------------------------------
    _GET_MATERIAL_TEMPS MATERIAL={material}

    {% set ext = printer["gcode_macro material_temps"].load %}
    {% set logfile = printer["gcode_macro MOISTURE_DIAGNOSTIC"].logfile %}
    {% set ts = printer.clock.realtime %}

    # -----------------------------------------
    # 3. HEAT TO ADAPTIVE TEMP
    # -----------------------------------------
    M104 S{ext}
    M109 S{ext}

    # -----------------------------------------
    # 4. PREP FOR EXTRUSION
    # -----------------------------------------
    G92 E0

    {% set length = printer["gcode_macro MOISTURE_DIAGNOSTIC"].extrude_length %}
    {% set slow = printer["gcode_macro MOISTURE_DIAGNOSTIC"].slow_feedrate %}
    {% set med = printer["gcode_macro MOISTURE_DIAGNOSTIC"].medium_feedrate %}
    {% set fast = printer["gcode_macro MOISTURE_DIAGNOSTIC"].fast_feedrate %}
    {% set retract = printer["gcode_macro MOISTURE_DIAGNOSTIC"].retract %}

    # -----------------------------------------
    # 5. SINGLE-SPEED OR MULTI-SPEED TEST
    # -----------------------------------------

    {% if multi == 0 %}
        # Slow pass (best for audible popping)
        G1 E{length} F{slow}
        G1 E-{retract} F600

        RUN_SHELL_COMMAND CMD="echo '{ts} | SINGLE | {material} | {length}mm @ {slow}mm/min' >> {logfile}"

    {% else %}
        # SLOW
        G1 E{length} F{slow}
        G1 E-{retract} F600
        RUN_SHELL_COMMAND CMD="echo '{ts} | SLOW | {material} | {length}mm @ {slow}mm/min' >> {logfile}"

        # MEDIUM
        G92 E0
        G1 E{length} F{med}
        G1 E-{retract} F600
        RUN_SHELL_COMMAND CMD="echo '{ts} | MEDIUM | {material} | {length}mm @ {med}mm/min' >> {logfile}"

        # FAST
        G92 E0
        G1 E{length} F{fast}
        G1 E-{retract} F600
        RUN_SHELL_COMMAND CMD="echo '{ts} | FAST | {material} | {length}mm @ {fast}mm/min' >> {logfile}"
    {% endif %}

    # -----------------------------------------
    # 6. FINAL EXTRUDER RESET
    # -----------------------------------------
    G92 E0

    # -----------------------------------------
    # 7. PARK AFTER TEST
    # -----------------------------------------
    G1 Z{printer["gcode_macro MOISTURE_DIAGNOSTIC"].park_z} F1200
    G1 X{printer["gcode_macro MOISTURE_DIAGNOSTIC"].park_x} \
       Y{printer["gcode_macro MOISTURE_DIAGNOSTIC"].park_y} F6000